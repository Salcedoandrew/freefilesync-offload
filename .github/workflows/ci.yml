name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: brew install llvm wxwidgets glib pkg-config openssl curl libssh2 libidn2

      # Engine test suite (hashing, copy-and-verify, duplicate detect,
      # corruption, name clash, reports, dry run, pause/cancel, fit check).
      - name: Build engine and run tests
        working-directory: FreeFileSync/Source
        run: make -f Makefile.macos test

      - name: Build engine archive for the app
        working-directory: FreeFileSync/Source
        run: make -f Makefile.macos liboffloadapi.a

      # Compiles the Swift window against the engine (swiftc via the
      # Makefile in offload/mac). This is the check the Linux VM cannot do.
      - name: Build Offload app (Swift)
        working-directory: FreeFileSync/Source/offload/mac
        run: make

      - name: Fit test
        working-directory: FreeFileSync/Source/offload/mac
        run: ./Offload --fit-test

      # End-to-end transfer through the real window code, on a fixture card.
      - name: App self-test
        working-directory: FreeFileSync/Source/offload/mac
        run: |
          mkdir -p /tmp/ffs-ci/card/DCIM /tmp/ffs-ci/dest
          head -c 1000000 /dev/urandom > /tmp/ffs-ci/card/DCIM/IMG_0001.CR3
          ./Offload --self-test /tmp/ffs-ci/card /tmp/ffs-ci/dest
