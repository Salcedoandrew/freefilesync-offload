name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: brew install llvm wxwidgets glib pkg-config openssl curl libssh2 libidn2

      # Engine test suite (hashing, copy-and-verify, duplicate detect,
      # corruption, name clash, reports, dry run, pause/cancel, fit check).
      - name: Build engine and run tests
        working-directory: FreeFileSync/Source
        run: make -f Makefile.macos test

      # The Skip matcher has no wx/glib dependency, so it builds and runs on its
      # own. Cheap, and it is the one piece that can silently lose files.
      - name: Skip-pattern tests
        working-directory: FreeFileSync/Source
        run: make -f Makefile.macos filter-test

      - name: Build engine archive for the app
        working-directory: FreeFileSync/Source
        run: make -f Makefile.macos liboffloadapi.a

      # Compiles the Swift window against the engine (swiftc via the
      # Makefile in offload/mac). This is the check the Linux VM cannot do.
      - name: Build Offload app (Swift)
        working-directory: FreeFileSync/Source/offload/mac
        run: make

      # Compiles the mouse driver without running it. CI cannot post CGEvents (that
      # needs Accessibility permission on a logged-in desktop), but a driver that
      # does not build turns `make ui-test` into a mystery on the machine that does.
      - name: Compile the mouse driver
        working-directory: FreeFileSync/Source/offload/mac
        run: make clickdriver

      - name: Fit test
        working-directory: FreeFileSync/Source/offload/mac
        run: ./Offload --fit-test

      # Version ordering, feed decoding, checksum parsing, and a real bundle
      # swap on disk: the step that replaces the app must work before it ships.
      - name: Update tests
        working-directory: FreeFileSync/Source/offload/mac
        run: ./Offload --update-test

      # End-to-end transfer through the real window code, on a fixture card.
      - name: App self-test
        working-directory: FreeFileSync/Source/offload/mac
        run: |
          mkdir -p /tmp/ffs-ci/card/DCIM /tmp/ffs-ci/dest
          # A real CR3 header (box size, "ftyp", brand "crx ") then a random
          # payload. A .CR3 of pure noise is a damaged file: it copies, but it
          # cannot be counted as verified, so it would fail this test instead of
          # exercising the transfer path.
          printf '\x00\x00\x00\x18ftypcrx ' > /tmp/ffs-ci/card/DCIM/IMG_0001.CR3
          head -c 1000000 /dev/urandom >> /tmp/ffs-ci/card/DCIM/IMG_0001.CR3
          ./Offload --self-test /tmp/ffs-ci/card /tmp/ffs-ci/dest
