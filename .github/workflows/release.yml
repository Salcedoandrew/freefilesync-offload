name: Release

# A release is cut from a commit CI has already called green:
#   - CI finishing on main - the normal path: bump the version, push, wait
#   - a hand-pushed v* tag, for a release you want without waiting on a push
#   - workflow_dispatch, to rebuild a version after a failed run
#
# The tag goes on the commit that changed the bundle version, not on whatever
# commit happened to trigger the run, and `gh release create --target` creates
# the tag on the remote when it is missing, so no laptop has to push one. If
# commits landed after the version bump, the run fails instead of publishing an
# archive that silently leaves them out.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# One release at a time: a tag push and a green CI run naming the same version
# must not race to create the same release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Cheap ubuntu gate. It answers one question: does this commit's version still
  # need a release? A push that does not bump the version costs one short job.
  gate:
    # CI finishing on a pull request is not a release candidate, and a red run
    # is not either.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      should_release: ${{ steps.resolve.outputs.should_release }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve version and check for an existing release
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            # The bundle version is the single source of truth, so the release
            # is named after the version inside the app it ships.
            VER=$(python3 -c "import plistlib,sys; print(plistlib.load(open(sys.argv[1],'rb'))['CFBundleShortVersionString'])" \
              FreeFileSync/Source/offload/mac/Info.plist)
            TAG="v$VER"
          fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ -z "$VERSION" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "No CFBundleShortVersionString in Info.plist - nothing to cut."
          elif gh release view "$TAG" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "$TAG already has a release - nothing to do."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Cutting $TAG."
          fi

  release:
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          # Full history: the next step walks back to find the commit that
          # introduced this version.
          fetch-depth: 0

      # The tag names the commit that changed the version, so the tag and the
      # archive describe the same code.
      #
      # A release is refused rather than cut from a tree that leaves commits
      # behind: if the newest commit is not the one that bumped the version,
      # whatever landed after it (a fix, a test, a revert) would be missing from
      # the archive while the tag claimed otherwise. A hand-pushed tag is the
      # exception, because there the tag itself picks the commit.
      - name: Check the release commit
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          PLIST="FreeFileSync/Source/offload/mac/Info.plist"

          version_at() {
            git show "$1:${PLIST}" | python3 -c \
              "import plistlib,sys; print(plistlib.loads(sys.stdin.buffer.read())['CFBundleShortVersionString'])"
          }

          HEAD_VERSION=$(version_at "$GITHUB_SHA")
          if [ "$HEAD_VERSION" != "$VERSION" ]; then
            echo "::error::$GITHUB_SHA ships version $HEAD_VERSION, but this release is for $VERSION."
            exit 1
          fi

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "Releasing the tagged commit $(git rev-parse --short HEAD), which ships $VERSION."
            exit 0
          fi

          BUMP=$(git log -1 --format=%H -S"<string>${VERSION}</string>" -- "$PLIST")
          if [ -z "$BUMP" ]; then
            echo "::error::No commit in this history introduced <string>${VERSION}</string>, so the version bump cannot be located."
            exit 1
          fi
          if [ "$BUMP" != "$GITHUB_SHA" ]; then
            echo "::error::${GITHUB_SHA} is $(git rev-list --count "${BUMP}..${GITHUB_SHA}") commit(s) after the version bump (${BUMP}), so publishing now would leave them out of the archive."
            echo "::error::Put the version bump last, or push a v${VERSION} tag at the commit you mean to release."
            git log --oneline "${BUMP}..${GITHUB_SHA}" | sed 's/^/    not in this release: /'
            exit 1
          fi
          echo "Releasing the version-bump commit $(git rev-parse --short HEAD), which ships $VERSION."

      - name: Install dependencies
        run: brew install llvm wxwidgets glib pkg-config openssl curl libssh2 libidn2

      # Engine test suite (hashing, copy-and-verify, duplicate detect,
      # corruption, name clash, reports, dry run, pause/cancel, fit check).
      - name: Build engine and run tests
        working-directory: FreeFileSync/Source
        run: make -f Makefile.macos test

      - name: Build engine archive for the app
        working-directory: FreeFileSync/Source
        run: make -f Makefile.macos liboffloadapi.a

      # Bundles Offload.app self-contained and writes
      # Offload-<version>-macos-arm64.zip + SHA256SUMS.txt (the updater
      # checks the zip against the sums file). The version comes from
      # Info.plist, and the zip target refuses to package a note that names a
      # different version.
      - name: Build release zip
        working-directory: FreeFileSync/Source/offload/mac
        run: make zip

      # The notes are the CHANGELOG section for this version, from its
      # "## <version>" heading to the next "## " heading.
      - name: Extract release notes
        env:
          VER: ${{ needs.gate.outputs.version }}
        run: |
          awk -v ver="$VER" 'index($0, "## " ver) == 1 {flag=1; next} /^## / {flag=0} flag' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            printf '%s\n' "Offload v$VER" > notes.md
          fi
          cat notes.md

      # Idempotent: a re-run uploads the assets to the existing release
      # instead of failing because the release already exists. --target makes
      # GitHub create the tag at this commit when it is missing.
      - name: Create GitHub release
        working-directory: FreeFileSync/Source/offload/mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber Offload-*.zip SHA256SUMS.txt
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" \
              --notes-file "$GITHUB_WORKSPACE/notes.md" Offload-*.zip SHA256SUMS.txt
          fi
