<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="24" viewBox="0 0 1280 24" role="presentation" aria-hidden="true">
  <defs>
    <pattern id="holes" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#15171A"/>
      <rect x="14" y="9" width="20" height="6" rx="2" fill="#2B2E33"/>
    </pattern>
    <!-- A mask is luminance, not alpha: the stops must be white, or the dark strip
         masks itself out and the divider disappears on a light page. -->
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.88" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="edges">
      <rect width="1280" height="24" fill="url(#fade)"/>
    </mask>
  </defs>
  <g mask="url(#edges)">
    <rect width="1280" height="24" fill="url(#holes)"/>
  </g>
</svg>
